name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.90 --profile minimal
          rustup default 1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/licenses | Out-Null
          Copy-Item target/release/tubefast.exe, README.md, LICENSE dist/
          Copy-Item assets/fonts/OFL-*.txt dist/licenses/
          Compress-Archive -Path dist/* -DestinationPath tubefast-windows-x64.zip
          Copy-Item target/release/tubefast.exe tubefast.exe
          "tubefast-windows-x64.zip", "tubefast.exe" | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $_" } | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Write the Scoop manifest
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $hash = ((Get-Content SHA256SUMS.txt | Where-Object { $_ -like "*tubefast-windows-x64.zip" }) -split "\s+")[0]
          $manifest = @"
          {
              "version": "$version",
              "description": "YouTube Music, native and fast. A lightweight desktop client with no browser engine.",
              "homepage": "https://github.com/${{ github.repository }}",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/${{ github.repository }}/releases/download/v$version/tubefast-windows-x64.zip",
                      "hash": "$hash"
                  }
              },
              "bin": "tubefast.exe",
              "shortcuts": [["tubefast.exe", "Tubefast"]]
          }
          "@
          [System.IO.File]::WriteAllText("$PWD/tubefast.json", $manifest + "`n")
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            tubefast-windows-x64.zip
            tubefast.exe
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} tubefast-windows-x64.zip tubefast.exe tubefast.json SHA256SUMS.txt --title "Tubefast ${{ github.ref_name }}" --generate-notes
