name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.90 --profile minimal
          rustup default 1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/licenses | Out-Null
          Copy-Item target/release/tubefast.exe, README.md, LICENSE dist/
          Copy-Item assets/fonts/OFL-*.txt dist/licenses/
          Compress-Archive -Path dist/* -DestinationPath tubefast-windows-x64.zip
          $hash = (Get-FileHash tubefast-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  tubefast-windows-x64.zip" | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} tubefast-windows-x64.zip SHA256SUMS.txt --title "Tubefast ${{ github.ref_name }}" --generate-notes
