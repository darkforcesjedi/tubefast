name: Feature request
description: Suggest something Tubefast should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation you are in, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - label: I can open a pull request for this
